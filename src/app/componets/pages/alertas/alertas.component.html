<div class="p-6 bg-gray-50 min-h-screen font-sans">

  <!-- Cabeçalho da Página -->
  <header class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Alertas</h1>
      <p class="text-sm text-gray-500">{{ getCount('ATIVOS') }} alertas ativos</p>
    </div>

  </header>

  <!-- Banner de Atenção Crítica -->
  <div *ngIf="hasCriticalAlerts" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-r-lg" role="alert">
    <p class="font-bold">Atenção Crítica!</p>
    <p>{{ getCount('CRÍTICOS') }} alerta(s) crítico(s) requerem ação imediata.</p>
  </div>

  <!-- Filtros -->
  <div class="flex space-x-2 mb-6">
    <button (click)="setFilter('ATIVOS')" [ngClass]="{'bg-teal-500 text-white': activeFilter === 'ATIVOS', 'bg-white text-gray-700': activeFilter !== 'ATIVOS'}" class="px-3 py-1 text-sm font-medium rounded-md border border-gray-300">Ativos ({{ getCount('ATIVOS') }})</button>
    <button (click)="setFilter('CRÍTICOS')" [ngClass]="{'bg-teal-500 text-white': activeFilter === 'CRÍTICOS', 'bg-white text-gray-700': activeFilter !== 'CRÍTICOS'}" class="px-3 py-1 text-sm font-medium rounded-md border border-gray-300">Críticos ({{ getCount('CRÍTICOS') }})</button>
    <button (click)="setFilter('RESOLVIDOS')" [ngClass]="{'bg-teal-500 text-white': activeFilter === 'RESOLVIDOS', 'bg-white text-gray-700': activeFilter !== 'RESOLVIDOS'}" class="px-3 py-1 text-sm font-medium rounded-md border border-gray-300">Resolvidos ({{ getCount('RESOLVIDOS') }})</button>
    <button (click)="setFilter('MANUTENÇÃO')" [ngClass]="{'bg-teal-500 text-white': activeFilter === 'MANUTENÇÃO', 'bg-white text-gray-700': activeFilter !== 'MANUTENÇÃO'}" class="px-3 py-1 text-sm font-medium rounded-md border border-gray-300">Manutenção ({{ getCount('MANUTENÇÃO') }})</button>
  </div>

  <!-- Lista de Alertas -->
  <div class="space-y-3">
    <div *ngFor="let alerta of filteredAlerts" class="bg-white rounded-lg shadow-sm">
      <div class="p-4 flex justify-between items-center">
        <div class="flex items-center">
          <div class="mr-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                 [ngClass]="{
                   'text-red-500': alerta.priority === 'ALTA',
                   'text-yellow-500': alerta.priority === 'MÉDIA',
                   'text-blue-500': alerta.priority === 'BAIXA'
                 }">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
          <div>
            <p class="font-semibold text-gray-800">{{ alerta.equipmentName }} - {{ alerta.location }}</p>
            <p class="text-sm text-gray-600">{{ alerta.description }}</p>
          </div>
        </div>
        <div class="text-right">
          <span class="text-xs font-bold py-1 px-2.5 rounded-full"
                [ngClass]="{
                  'bg-red-100 text-red-700': alerta.priority === 'ALTA',
                  'bg-yellow-100 text-yellow-700': alerta.priority === 'MÉDIA',
                  'bg-green-100 text-green-700': alerta.priority === 'BAIXA'
                }">{{ alerta.priority }}</span>
          <p class="text-xs text-gray-400 mt-1">{{ alerta.timestamp }}</p>
        </div>
      </div>

      <!-- Barra de Ações -->
      <div class="bg-gray-800 p-2 rounded-b-lg flex justify-between items-center">
        <div class="flex items-center space-x-4">
          <!-- Lógica do botão "Resolver" atualizada -->
          <button (click)="resolve(alerta)" *ngIf="alerta.status === 'MANUTENÇÃO'"
                  class="flex items-center text-white text-sm font-medium py-1 px-3 rounded hover:bg-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            Resolver
          </button>

          <button (click)="sendToMaintenance(alerta)" *ngIf="alerta.status === 'ATIVO' || alerta.status === 'CRÍTICO'"
                  class="flex items-center text-white text-sm font-medium py-1 px-3 rounded hover:bg-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            Mandar para Manutenção
          </button>

          <div *ngIf="alerta.status === 'RESOLVIDO'" class="flex items-center text-green-400 text-sm font-medium py-1 px-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              Resolvido
          </div>
           <div *ngIf="alerta.status === 'MANUTENÇÃO'" class="flex items-center text-yellow-400 text-sm font-medium py-1 px-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
              Em Manutenção
          </div>
        </div>
        <div class="flex items-center space-x-1">
          <button (click)="delete(alerta)" class="text-gray-400 hover:text-white p-1 rounded">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
          <button *ngIf="alerta.status === 'CRÍTICO'" class="text-red-500 hover:text-red-400 p-1 rounded">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01" /></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
