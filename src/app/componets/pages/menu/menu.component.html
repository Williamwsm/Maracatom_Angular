<!-- O *ngIf garante que o menu só será exibido quando os dados do usuário forem carregados -->
<div class="w-64 h-screen bg-white p-4 font-sans flex flex-col justify-between border-r border-gray-200" *ngIf="currentUser">

    <div>
        <!-- Seção do Cabeçalho/Logo com dados dinâmicos -->
        <div class="flex items-center mb-8 px-2">
            <div class="bg-teal-500 p-3 rounded-lg mr-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7.014A8.003 8.003 0 0117.657 18.657z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 16.121A3 3 0 1014.12 11.88l-4.242 4.242z" />
                </svg>
            </div>
            <div>
                <h1 class="text-base font-bold text-gray-800">ClimaTech</h1>
                <!-- Exibe o nome da instituição vindo do serviço -->
                <p class="text-xs text-gray-500">{{ currentUser.institution }}</p>
            </div>
        </div>

        <!-- Seção de Monitoramento -->
        <div class="mb-6">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">
                Monitoramento
            </h2>
            <nav>
                <ul>
                    <li *ngFor="let item of monitoringItems" class="mb-1">
                        <!--
                          - [routerLink] cuida da navegação.
                          - routerLinkActive aplica classes CSS quando a rota está ativa.
                          - (click) chama nossa função para limpar o badge.
                        -->
                        <a [routerLink]="item.route"
                           routerLinkActive="bg-gray-100 text-gray-900 font-semibold"
                           [routerLinkActiveOptions]="{exact: true}"
                           (click)="onItemClick(item)"
                           class="flex items-center justify-between p-2 rounded-md text-sm text-gray-600 hover:bg-gray-100 hover:text-gray-900">

                            <div class="flex items-center">
                                <span [ngSwitch]="item.icon" class="mr-3 text-gray-500">
                                    <!-- Ícones SVG (sem alteração) -->
                                    <svg *ngSwitchCase="'home'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                                    <svg *ngSwitchCase="'thermometer'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3.25a2.25 2.25 0 0 0-4.5 0V10l-1.72 1.72a3.75 3.75 0 0 0 5.3 5.3L13 10Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M9 14.25A2.25 2.25 0 0 0 11.25 12H12a2.25 2.25 0 0 1 2.25 2.25V15a2.25 2.25 0 0 1-2.25 2.25h-1.5A2.25 2.25 0 0 1 9 15v-.75Z" /></svg>
                                    <svg *ngSwitchCase="'alert-triangle'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" /></svg>
                                    <svg *ngSwitchCase="'recommendation'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 004.472-.69a.75.75 0 01.819.162l1.31.982a.75.75 0 01-.274 1.222unA11.217 11.217 0 0118 18.75a11.25 11.25 0 01-11.25-11.25 11.217 11.217 0 012.31-6.684l.982 1.31z" /><path stroke-linecap="round" stroke-linejoin="round" d="M12.75 3.75v3.75L15 9" /></svg>
                                    <svg *ngSwitchCase="'history'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                    <svg *ngSwitchCase="'document'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                </span>
                                <span>{{ item.label }}</span>
                            </div>
                            <!-- Badge dinâmico: só aparece se a contagem for maior que 0 -->
                            <span *ngIf="item.key && notifications && notifications[item.key] > 0" class="flex items-center justify-center text-xs font-bold text-white bg-red-400 px-2 py-0.5 rounded-full">
                                {{ notifications[item.key] }}
                            </span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Seção de Administração (mesma lógica) -->
        <div class="mb-6">
             <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">
                Administração
            </h2>
            <nav>
                <ul>
                    <li *ngFor="let item of adminItems" class="mb-1">
                        <a [routerLink]="item.route"
                           routerLinkActive="bg-gray-100 text-gray-900 font-semibold"
                           [routerLinkActiveOptions]="{exact: true}"
                           (click)="onItemClick(item)"
                           class="flex items-center justify-between p-2 rounded-md text-sm text-gray-600 hover:bg-gray-100 hover:text-gray-900">

                            <div class="flex items-center">
                                <span [ngSwitch]="item.icon" class="mr-3 text-gray-500">
                                    <!-- Ícones SVG -->
                                    <svg *ngSwitchCase="'settings'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                    <svg *ngSwitchCase="'users'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                    </svg>
                                    <svg *ngSwitchCase="'maintenance'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
                                    </svg>
                                </span>
                                <span>{{ item.label }}</span>
                            </div>
                            <span *ngIf="item.key && notifications && notifications[item.key] > 0" class="flex items-center justify-center text-xs font-bold text-white bg-red-400 px-2 py-0.5 rounded-full">
                                {{ notifications[item.key] }}
                            </span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Seção do Rodapé/Usuário com dados dinâmicos -->
    <div class="border-t border-gray-200 pt-4">
        <a href="#" class="flex items-center p-2 rounded-md hover:bg-gray-100">
            <!-- Avatar com a primeira letra do nome do usuário -->
            <div class="w-9 h-9 rounded-full bg-gray-200 flex items-center justify-center mr-3">
                <span class="text-sm font-bold text-gray-500">{{ currentUser.name.charAt(0) }}</span>
            </div>
            <div>
                <!-- Exibe o nome e email vindos do serviço -->
                <p class="text-sm font-semibold text-gray-800">{{ currentUser.name }}</p>
                <p class="text-xs text-gray-500">{{ currentUser.email }}</p>
            </div>
        </a>
    </div>

</div>
